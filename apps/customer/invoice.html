<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice | ShipNovaPortal</title><link rel="stylesheet" href="../shared/styles.css"></head><body><main class="wrap" style="padding:24px"><section class="card" id="invoice">Loading...</section></main><script src="../shared/auth.js"></script><script>
const id=new URLSearchParams(location.search).get('id'); async function load(){try{const d=await SNP.request('/api/v1/invoices/'+id);const i=d.invoice;document.getElementById('invoice').innerHTML='<h1>ShipNovaPortal Invoice</h1><p><b>'+SNP.esc(i.invoice_number)+'</b></p><p>Booking: '+SNP.esc(i.booking_number)+'</p><p>From: '+SNP.esc(i.pickup_address)+'</p><p>To: '+SNP.esc(i.drop_address)+'</p><p>Payment: '+SNP.esc(i.method)+' / '+SNP.esc(i.status)+'</p><h2>₹'+Number(i.amount).toFixed(2)+'</h2><button class="primary" onclick="print()">Print / Save PDF</button>'}catch(e){document.getElementById('invoice').textContent=e.message}}load();</script></body></html>
