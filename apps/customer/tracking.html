<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Delivery | ShipNovaPortal</title><link rel="stylesheet" href="../shared/styles.css"><style>.mapbox{min-height:180px;border-radius:14px;background:#f3f6fa;display:grid;place-items:center;text-align:center;padding:20px}.timeline{display:grid;gap:10px}.event{padding:12px;border:1px solid #eaecf0;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><header class="bar"><div class="wrap bar-in"><div class="brand">ShipNovaPortal</div><div class="actions"><button class="secondary" onclick="location.href='dashboard.html'">My Bookings</button><button class="secondary" onclick="SNP.logout()">Logout</button></div></div></header><main class="wrap dashboard"><section class="card hero"><span class="pill">Live Tracking</span><h1 id="title">Loading...</h1><p id="status" class="muted">Checking delivery status...</p><div id="summary" class="grid"></div><div id="map" class="mapbox">Driver location will appear here when available.</div></section><section class="card hero" style="margin-top:20px"><h2>Delivery Events</h2><div id="events" class="timeline">Loading...</div></section></main><script src="../shared/auth.js"></script><script>const id=new URLSearchParams(location.search).get('booking');const $=x=>document.getElementById(x);function fmt(v){return v?new Date(v).toLocaleString():'—'}async function load(){if(!id){$('title').textContent='Booking ID missing';return}try{const d=await SNP.request('/api/v1/bookings/'+encodeURIComponent(id)+'/tracking');const t=d.tracking;$('title').textContent='Booking '+SNP.esc(t.booking_number);$('status').textContent=t.status.replaceAll('_',' ');$('summary').innerHTML=[['Driver',t.driver_name||'Not assigned'],['Phone',t.driver_phone||'—'],['Tracking Code',t.tracking_code||'—'],['Fare','₹'+Number(t.total_fare||0).toFixed(2)],['Pickup',t.pickup_address],['Drop',t.drop_address]].map(x=>`<div class="card stat"><span class="muted">${SNP.esc(x[0])}</span><b>${SNP.esc(x[1])}</b></div>`).join('');if(t.driver_lat!=null&&t.driver_lng!=null){$('map').innerHTML=`<b>Driver location available</b><br>Latitude: ${Number(t.driver_lat).toFixed(6)}<br>Longitude: ${Number(t.driver_lng).toFixed(6)}<br><span class="muted">Updated: ${fmt(t.last_location_at)}</span>`}$('events').innerHTML=t.events.length?t.events.map(e=>`<div class="event"><b>${SNP.esc(e.event_type.replaceAll('_',' '))}</b><br><span class="muted">${fmt(e.created_at)}</span>${e.note?`<br>${SNP.esc(e.note)}`:''}${e.latitude!=null?`<br>Location: ${Number(e.latitude).toFixed(5)}, ${Number(e.longitude).toFixed(5)}`:''}</div>`).join(''):'No events yet.'}catch(e){$('title').textContent=e.message}}load();setInterval(load,10000);</script></body></html>
