<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipNovaPortal Customer</title><link rel="stylesheet" href="../shared/styles.css"></head><body><main class="auth"><section class="card auth-card"><div class="logo"><div class="logo-badge">SN</div><div><div class="brand">ShipNovaPortal</div><div class="muted">Customer Portal</div></div></div><h1 class="h1" id="title">Customer Login</h1><p class="muted" id="sub">Sign in to manage your deliveries.</p><div id="msg" class="msg"></div><form id="form" class="form"><div id="nameField" class="field" hidden><label>Full name</label><input id="name" autocomplete="name"></div><div class="field"><label>Phone or Email</label><input id="identifier" required autocomplete="username"></div><div id="emailField" class="field" hidden><label>Email</label><input id="email" type="email" autocomplete="email"></div><div id="phoneField" class="field" hidden><label>Phone</label><input id="phone" autocomplete="tel"></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required autocomplete="current-password"></div><button class="primary" id="submit">Login</button></form><div class="links"><a href="#" id="toggle">Create customer account</a><a href="../driver/index.html">Driver Portal</a><a href="../admin/index.html">Admin Portal</a></div></section></main><script src="../shared/auth.js"></script><script>
let register=false; const $=id=>document.getElementById(id); const msg=$('msg');
function show(text,ok=false){msg.textContent=text;msg.className='msg show '+(ok?'ok':'error')}
function render(){ $('title').textContent=register?'Create Customer Account':'Customer Login';$('sub').textContent=register?'Register to start using ShipNovaPortal.':'Sign in to manage your deliveries.';$('submit').textContent=register?'Register':'Login';$('toggle').textContent=register?'Already have an account? Login':'Create customer account';$('nameField').hidden=!register;$('emailField').hidden=!register;$('phoneField').hidden=!register;$('identifier').hidden=register;$('identifier').required=!register;$('password').autocomplete=register?'new-password':'current-password';}
$('toggle').onclick=e=>{e.preventDefault();register=!register;msg.className='msg';render()};
$('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';try{let data;if(register){data=await SNP.request('/api/v1/auth/register/customer',{method:'POST',body:JSON.stringify({fullName:$('name').value,phone:$('phone').value,email:$('email').value,password:$('password').value})})}else{data=await SNP.request('/api/v1/auth/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});if(data.user.role!=='customer')throw new Error('This account belongs to '+data.user.role+' portal.');}SNP.saveSession(data);show('Success. Opening your dashboard...',true);setTimeout(()=>location.href='dashboard.html',300)}catch(err){show(err.message)}};render();
</script></body></html>
