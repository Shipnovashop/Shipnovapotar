<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | ShipNovaPortal</title><link rel="stylesheet" href="../shared/styles.css"></head><body>
<header class="bar"><div class="wrap bar-in"><div class="brand">ShipNovaPortal</div><button class="secondary" onclick="SNP.logout()">Logout</button></div></header>
<main class="wrap dashboard"><section class="card hero"><span class="pill">Payment</span><h1>Complete your booking payment</h1><div id="info" class="note">Loading...</div><div id="msg" class="msg"></div><div class="actions" style="margin-top:14px"><button id="online" class="primary">Pay Online</button><button id="cod" class="secondary">Choose Cash on Delivery</button><a class="secondary" href="dashboard.html">Back</a></div></section></main>
<script src="../shared/auth.js"></script><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
const id=new URLSearchParams(location.search).get('booking'); const $=x=>document.getElementById(x); function show(t,ok=false){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'error')}
async function load(){if(!id){show('Booking ID is missing.');return}try{const b=await SNP.request('/api/v1/bookings/'+id); $('info').innerHTML='<b>'+SNP.esc(b.booking.bookingNumber)+'</b><br>Fare: ₹'+Number(b.booking.totalFare).toFixed(2)+'<br>'+SNP.esc(b.booking.pickupAddress)+' → '+SNP.esc(b.booking.dropAddress); const p=await SNP.request('/api/v1/bookings/'+id+'/payment').catch(()=>null); if(p?.payment?.status==='paid'){show('Payment is already completed.',true);$('online').disabled=true;$('cod').disabled=true}}catch(e){show(e.message)}}
$('cod').onclick=async()=>{try{const d=await SNP.request('/api/v1/bookings/'+id+'/payment',{method:'POST',body:JSON.stringify({method:'cod'})});show('Cash on Delivery selected.',true);setTimeout(()=>location.href='dashboard.html',700)}catch(e){show(e.message)}};
$('online').onclick=async()=>{try{const d=await SNP.request('/api/v1/bookings/'+id+'/payment',{method:'POST',body:JSON.stringify({method:'online'})});if(!d.razorpay)throw new Error('Online payment is not configured.');const r=new Razorpay({key:d.razorpay.keyId,order_id:d.razorpay.orderId,amount:d.razorpay.amount,currency:d.razorpay.currency,name:'ShipNovaPortal',description:'Delivery booking '+id,handler:async function(res){try{const v=await SNP.request('/api/v1/payments/verify',{method:'POST',body:JSON.stringify({razorpayOrderId:res.razorpay_order_id,razorpayPaymentId:res.razorpay_payment_id,razorpaySignature:res.razorpay_signature})});show('Payment verified successfully.',true);setTimeout(()=>location.href='dashboard.html',800)}catch(e){show(e.message)}}});r.open()}catch(e){show(e.message)}};
load();
</script></body></html>
