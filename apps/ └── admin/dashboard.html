<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShipNovaPortal Admin</title><link rel="stylesheet" href="../shared/styles.css">
<style>
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid #d0d5dd;border-radius:10px}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:720px}.admin-table th,.admin-table td{text-align:left;padding:12px;border-bottom:1px solid #eaecf0;font-size:14px}.admin-table th{background:#f8fafc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:700}.section{margin-top:20px;padding:22px}.actions-cell{display:flex;gap:6px;flex-wrap:wrap}.small{padding:8px 10px;font-size:13px}.empty{padding:25px;text-align:center;color:#667085}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.tabs button.active{background:#172033;color:#fff}
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in"><div class="brand">ShipNovaPortal Admin</div><button class="secondary" onclick="SNP.logout()">Logout</button></div></header>
<main class="wrap dashboard">
<section class="card hero"><span class="pill">Administrator</span><h1 id="welcome">Admin Dashboard</h1><p class="muted">Manage customers, drivers and vehicles.</p>
<div id="msg" class="msg"></div><div id="stats" class="grid"></div>
<div class="tabs"><button id="customersTab" class="secondary active" onclick="showTab('customers')">Customers</button><button id="driversTab" class="secondary" onclick="showTab('drivers')">Drivers</button><button id="deliveriesTab" class="secondary" onclick="showTab('deliveries')">Deliveries</button></div>
<section id="customers" class="card section"><h2>Customers</h2><div class="toolbar"><input id="customerSearch" placeholder="Search name, phone or email"><button class="primary" onclick="loadCustomers()">Search</button></div><div id="customersTable" class="table-wrap"></div></section>
<section id="drivers" class="card section" style="display:none"><h2>Drivers</h2><div class="toolbar"><input id="driverSearch" placeholder="Search name, phone or email"><select id="driverStatus"><option value="">All status</option><option value="pending">Pending</option><option value="active">Active</option><option value="suspended">Suspended</option><option value="blocked">Blocked</option></select><button class="primary" onclick="loadDrivers()">Search</button></div><div id="driversTable" class="table-wrap"></div></section>
<section id="deliveries" class="card section" style="display:none"><h2>Delivery Control</h2><div class="toolbar"><select id="deliveryStatus"><option value="">All</option><option value="requested">Requested</option><option value="searching_driver">Searching Driver</option><option value="driver_assigned">Driver Assigned</option><option value="driver_accepted">Driver Accepted</option><option value="picked_up">Picked Up</option><option value="out_for_delivery">Out for Delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select><button class="primary" onclick="loadDeliveries()">Refresh</button></div><div id="deliveriesTable" class="table-wrap">Loading...</div></section>
</section></main>
<script src="../shared/auth.js"></script>
<script>
const $=id=>document.getElementById(id); const esc=SNP.esc;
function showMsg(text,ok=false){$('msg').textContent=text;$('msg').className='msg show '+(ok?'ok':'error');}
function showTab(tab){$('customers').style.display=tab==='customers'?'block':'none';$('drivers').style.display=tab==='drivers'?'block':'none';$('deliveries').style.display=tab==='deliveries'?'block':'none';$('customersTab').classList.toggle('active',tab==='customers');$('driversTab').classList.toggle('active',tab==='drivers');$('deliveriesTab').classList.toggle('active',tab==='deliveries');if(tab==='deliveries')loadDeliveries();}
async function autoAssign(id){try{const d=await SNP.request('/api/v1/admin/assignments/auto',{method:'POST',body:JSON.stringify({bookingId:id,radiusKm:15})});showMsg(d.message||'Driver assigned.',true);await loadDeliveries()}catch(e){showMsg(e.message)}}
async function loadDeliveries(){try{const st=$('deliveryStatus').value;const d=await SNP.request('/api/v1/bookings'+(st?'?status='+encodeURIComponent(st):''));if(!d.bookings.length){$('deliveriesTable').innerHTML='<div class="empty">No bookings found.</div>';return}$('deliveriesTable').innerHTML='<table class="admin-table"><thead><tr><th>Booking</th><th>Status</th><th>Vehicle</th><th>Fare</th><th>Created</th><th>Action</th></tr></thead><tbody>'+d.bookings.map(b=>`<tr><td><b>${esc(b.bookingNumber)}</b><br><span class="muted">${esc(b.pickupAddress)} → ${esc(b.dropAddress)}</span></td><td><span class="badge">${esc(b.status)}</span></td><td>${esc(b.vehicleType)}</td><td>₹${Number(b.totalFare).toFixed(2)}</td><td>${new Date(b.createdAt).toLocaleString()}</td><td class="actions-cell">${['requested','searching_driver'].includes(b.status)?`<button class="primary small" onclick="autoAssign('${b.id}')">Auto Assign</button>`:''}<button class="secondary small" onclick="trackAdmin('${b.id}')">Track</button></td></tr>`).join('')+'</tbody></table>'}catch(e){showMsg(e.message)}}
function trackAdmin(id){window.open('../customer/tracking.html?booking='+encodeURIComponent(id),'_blank')}
async function loadStats(){const d=await SNP.request('/api/v1/admin/stats');const s=d.stats;$('stats').innerHTML=[['Customers',s.customers],['Drivers',s.drivers],['Pending Drivers',s.pending_drivers],['Active Drivers',s.active_drivers],['Blocked Users',s.blocked_users]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');}
async function loadCustomers(){try{const q=$('customerSearch').value.trim();const d=await SNP.request('/api/v1/admin/customers'+(q?'?search='+encodeURIComponent(q):''));if(!d.customers.length){$('customersTable').innerHTML='<div class="empty">No customers found.</div>';return}$('customersTable').innerHTML='<table class="admin-table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Status</th><th>Action</th></tr></thead><tbody>'+d.customers.map(c=>`<tr><td>${esc(c.full_name)}</td><td>${esc(c.phone)}</td><td>${esc(c.email||'—')}</td><td><span class="badge">${esc(c.status)}</span></td><td class="actions-cell"><button class="secondary small" onclick="customerStatus('${c.id}','${c.status==='blocked'?'active':'blocked'}')">${c.status==='blocked'?'Unblock':'Block'}</button></td></tr>`).join('')+'</tbody></table>'}catch(e){showMsg(e.message)}}
async function customerStatus(id,status){try{await SNP.request('/api/v1/admin/customers/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});showMsg('Customer status updated.',true);await Promise.all([loadStats(),loadCustomers()])}catch(e){showMsg(e.message)}}
async function loadDrivers(){try{const params=new URLSearchParams();const q=$('driverSearch').value.trim(),s=$('driverStatus').value;if(q)params.set('search',q);if(s)params.set('status',s);const d=await SNP.request('/api/v1/admin/drivers?'+params.toString());if(!d.drivers.length){$('driversTable').innerHTML='<div class="empty">No drivers found.</div>';return}$('driversTable').innerHTML='<table class="admin-table"><thead><tr><th>Driver</th><th>Phone</th><th>Status</th><th>Verified</th><th>Vehicles</th><th>Action</th></tr></thead><tbody>'+d.drivers.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.phone)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.is_verified?'Yes':'No'}</td><td>${x.vehicle_count}</td><td class="actions-cell">${x.status==='pending'?`<button class="primary small" onclick="driverAction('${x.id}','approve')">Approve</button><button class="danger small" onclick="driverAction('${x.id}','reject')">Reject</button>`:`<button class="secondary small" onclick="driverAction('${x.id}','${x.status==='blocked'?'active':'blocked'}')">${x.status==='blocked'?'Unblock':'Block'}</button>`}<button class="secondary small" onclick="vehicles('${x.id}', '${esc(x.full_name)}')">Vehicles</button></td></tr>`).join('')+'</tbody></table>'}catch(e){showMsg(e.message)}}
async function driverAction(id,action){try{let d;if(action==='approve'||action==='reject')d=await SNP.request('/api/v1/admin/drivers/'+id+'/'+action,{method:'POST'});else d=await SNP.request('/api/v1/admin/drivers/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:action})});showMsg(d.message||'Driver updated.',true);await Promise.all([loadStats(),loadDrivers()])}catch(e){showMsg(e.message)}}
async function vehicles(id,name){try{const d=await SNP.request('/api/v1/admin/drivers/'+id+'/vehicles');const list=d.vehicles.map(v=>`${v.vehicle_type} — ${v.registration_number} (${v.is_active?'active':'inactive'})`).join('\n')||'No vehicles';alert('Vehicles for '+name+'\n\n'+list)}catch(e){showMsg(e.message)}}
(async()=>{try{const d=await SNP.request('/api/v1/auth/me');if(d.user.role!=='admin')throw new Error('Admin access required.');$('welcome').textContent='Welcome, '+(d.user.fullName||'Admin');await Promise.all([loadStats(),loadCustomers(),loadDrivers(),loadDeliveries()])}catch(e){localStorage.removeItem('snp_token');localStorage.removeItem('snp_user');location.href='index.html'}})();
</script>
</body></html>
