<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payments | ShipNovaPortal Admin</title><link rel="stylesheet" href="../shared/styles.css"></head><body><header class="bar"><div class="wrap bar-in"><div class="brand">ShipNovaPortal Admin</div><button class="secondary" onclick="SNP.logout()">Logout</button></div></header><main class="wrap dashboard"><section class="card hero"><h1>Payments</h1><div id="list">Loading...</div></section></main><script src="../shared/auth.js"></script><script>
async function load(){try{const d=await SNP.request('/api/v1/admin/payments');document.getElementById('list').innerHTML=d.payments.length?d.payments.map(p=>'<div class="note" style="margin:10px 0"><b>'+SNP.esc(p.booking_number)+'</b> · ₹'+Number(p.amount).toFixed(2)+' · '+SNP.esc(p.method)+' · '+SNP.esc(p.status)+'<br>'+SNP.esc(p.customer_name||'')+' · '+SNP.esc(p.customer_phone||'')+(p.invoice_number?'<br>Invoice: '+SNP.esc(p.invoice_number):'')+'<div class="actions" style="margin-top:8px">'+(p.status==='pending'?'<button class="primary" onclick="mark(\''+p.id+'\',\'paid\')">Mark Paid</button><button class="danger" onclick="mark(\''+p.id+'\',\'failed\')">Mark Failed</button>':'')+'</div></div>').join(''):'No payments found.'}catch(e){document.getElementById('list').textContent=e.message}}
async function mark(id,status){try{await SNP.request('/api/v1/admin/payments/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});load()}catch(e){alert(e.message)}}
(async()=>{try{const m=await SNP.request('/api/v1/auth/me');if(m.user.role!=='admin')throw new Error();load()}catch(e){location.href='index.html'}})();
</script></body></html>
