<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipNovaPortal Admin</title><link rel="stylesheet" href="../shared/styles.css"></head><body><main class="auth"><section class="card auth-card"><div class="logo"><div class="logo-badge">SN</div><div><div class="brand">ShipNovaPortal</div><div class="muted">Admin Portal</div></div></div><h1 class="h1">Admin Login</h1><p class="muted">Use the administrator credentials configured in the backend environment.</p><div id="msg" class="msg"></div><form id="form" class="form"><div class="field"><label>Email</label><input id="identifier" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary">Login</button></form><div class="links"><a href="../customer/index.html">Customer Portal</a><a href="../driver/index.html">Driver Portal</a></div></section></main><script src="../shared/auth.js"></script><script>const $=id=>document.getElementById(id),msg=$('msg');$('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';try{const d=await SNP.request('/api/v1/auth/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});if(d.user.role!=='admin')throw new Error('This account is not an administrator.');SNP.saveSession(d);location.href='dashboard.html'}catch(e){msg.textContent=e.message;msg.className='msg show error'}};</script></body></html>
