<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Driver Dashboard | ShipNovaPortal</title><link rel="stylesheet" href="../shared/styles.css"><style>.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.job{padding:16px;border:1px solid #eaecf0;border-radius:14px;margin-top:12px}.job h3{margin:0 0 6px}.otp{font-size:26px;letter-spacing:6px;font-weight:800}.hidden{display:none}</style></head><body><header class="bar"><div class="wrap bar-in"><div class="brand">ShipNovaPortal Driver</div><button class="secondary" onclick="SNP.logout()">Logout</button></div></header><main class="wrap dashboard"><section class="card hero"><span class="pill">Driver</span><h1 id="welcome">Welcome</h1><div id="msg" class="msg"></div><div class="grid"><div class="card stat"><span class="muted">Account</span><b id="account">—</b></div><div class="card stat"><span class="muted">Availability</span><b id="availability">—</b></div><div class="card stat"><span class="muted">Verification</span><b id="verified">—</b></div></div><div class="toolbar" style="margin-top:15px"><button class="primary" onclick="setStatus('available')">Go Online</button><button class="secondary" onclick="setStatus('offline')">Go Offline</button><button class="secondary" onclick="sendLocation()">Update Location</button></div></section><section class="card hero" style="margin-top:20px"><div class="toolbar"><h2 style="margin-right:auto">My Deliveries</h2><button class="secondary" onclick="loadAssignments()">Refresh</button></div><div id="jobs">Loading...</div></section></main><script src="../shared/auth.js"></script><script>const $=id=>document.getElementById(id);let otpCache={};function show(text,ok=false){$('msg').textContent=text;$('msg').className='msg show '+(ok?'ok':'error')}async function me(){const d=await SNP.request('/api/v1/driver/me');$('welcome').textContent='Welcome, '+(d.driver.full_name||'Driver');$('account').textContent=d.driver.account_status;$('availability').textContent=d.driver.status;$('verified').textContent=d.driver.is_verified?'Approved':'Pending'}async function setStatus(status){try{await SNP.request('/api/v1/driver/me/status',{method:'PATCH',body:JSON.stringify({status})});show('Availability updated.',true);await me()}catch(e){show(e.message)}}function sendLocation(){if(!navigator.geolocation)return show('Location is not supported by this browser.');navigator.geolocation.getCurrentPosition(async p=>{try{await SNP.request('/api/v1/driver/me/location',{method:'PATCH',body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});show('Location updated.',true)}catch(e){show(e.message)}},e=>show('Location permission required.'))}async function action(id,type){try{let d;if(type==='accept'||type==='reject')d=await SNP.request('/api/v1/driver/assignments/'+id+'/'+type,{method:'POST'});show(d.message||'Updated.',true);await Promise.all([me(),loadAssignments()])}catch(e){show(e.message)}}async function pickup(booking){try{const d=await SNP.request('/api/v1/driver/bookings/'+booking+'/pickup',{method:'POST'});show(d.message,true);await loadAssignments()}catch(e){show(e.message)}}async function startDelivery(booking){try{const d=await SNP.request('/api/v1/driver/bookings/'+booking+'/out-for-delivery',{method:'POST'});otpCache[booking]=d.deliveryOtp;alert('Delivery OTP (share with customer): '+d.deliveryOtp+'\nExpires in '+d.otpExpiresInMinutes+' minutes.');await loadAssignments()}catch(e){show(e.message)}}async function deliver(booking){const otp=prompt('Enter the 6-digit delivery OTP from the customer:');if(!otp)return;try{const d=await SNP.request('/api/v1/driver/bookings/'+booking+'/deliver',{method:'POST',body:JSON.stringify({otp:otp.trim()})});show(d.message,true);await Promise.all([me(),loadAssignments()])}catch(e){show(e.message)}}async function loadAssignments(){try{const d=await SNP.request('/api/v1/driver/assignments');if(!d.assignments.length){$('jobs').innerHTML='<div class="note">No active assignments.</div>';return}$('jobs').innerHTML=d.assignments.map(a=>{let buttons='';if(a.status==='pending')buttons=`<button class="primary" onclick="action('${a.id}','accept')">Accept</button><button class="danger" onclick="action('${a.id}','reject')">Reject</button>`;if(a.status==='accepted'&&a.booking_status==='driver_accepted')buttons=`<button class="primary" onclick="pickup('${a.booking_id}')">Picked Up</button>`;if(a.status==='accepted'&&a.booking_status==='picked_up')buttons=`<button class="primary" onclick="startDelivery('${a.booking_id}')">Out for Delivery</button>`;if(a.status==='accepted'&&a.booking_status==='out_for_delivery')buttons=`<button class="primary" onclick="deliver('${a.booking_id}')">Complete Delivery</button>`;return `<article class="job"><h3>${SNP.esc(a.booking_number)} · ${SNP.esc(a.booking_status.replaceAll('_',' '))}</h3><p>${SNP.esc(a.pickup_address)} → ${SNP.esc(a.drop_address)}</p><p class="muted">${SNP.esc(a.package_description)} · ${Number(a.weight_kg||0)} kg · ${SNP.esc(a.vehicle_type)} · ₹${Number(a.total_fare||0).toFixed(2)}</p><div class="toolbar">${buttons}</div></article>`}).join('')}catch(e){$('jobs').textContent=e.message}}(async()=>{try{const d=await SNP.request('/api/v1/auth/me');if(d.user.role!=='driver')throw 0;await Promise.all([me(),loadAssignments()])}catch(e){location.href='index.html'}})();setInterval(loadAssignments,10000);setInterval(()=>{if(document.visibilityState==='visible')sendLocation()},30000);</script></body></html>
