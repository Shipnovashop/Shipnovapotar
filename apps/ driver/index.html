<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShipNovaPortal Driver</title><link rel="stylesheet" href="../shared/styles.css"></head><body><main class="auth"><section class="card auth-card"><div class="logo"><div class="logo-badge">SN</div><div><div class="brand">ShipNovaPortal</div><div class="muted">Driver Portal</div></div></div><h1 class="h1" id="title">Driver Login</h1><p class="muted" id="sub">Sign in to manage your delivery assignments.</p><div id="msg" class="msg"></div><form id="form" class="form"><div id="nameField" class="field" hidden><label>Full name</label><input id="name"></div><div id="emailField" class="field" hidden><label>Email</label><input id="email" type="email"></div><div id="phoneField" class="field" hidden><label>Phone</label><input id="phone"></div><div id="identifierField" class="field"><label>Phone or Email</label><input id="identifier" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="primary" id="submit">Login</button></form><div class="links"><a href="#" id="toggle">Register as driver</a><a href="../customer/index.html">Customer Portal</a><a href="../admin/index.html">Admin Portal</a></div></section></main><script src="../shared/auth.js"></script><script>let register=false;const $=id=>document.getElementById(id),msg=$('msg');function show(t,o=false){msg.textContent=t;msg.className='msg show '+(o?'ok':'error')}function render(){$('title').textContent=register?'Driver Registration':'Driver Login';$('sub').textContent=register?'Create a driver account. Admin approval is required before going online.':'Sign in to manage your delivery assignments.';$('submit').textContent=register?'Register':'Login';$('toggle').textContent=register?'Already registered? Login':'Register as driver';$('nameField').hidden=!register;$('emailField').hidden=!register;$('phoneField').hidden=!register;$('identifierField').hidden=register;$('identifier').required=!register}$('toggle').onclick=e=>{e.preventDefault();register=!register;msg.className='msg';render()};$('form').onsubmit=async e=>{e.preventDefault();msg.className='msg';try{let d;if(register){d=await SNP.request('/api/v1/auth/register/driver',{method:'POST',body:JSON.stringify({fullName:$('name').value,phone:$('phone').value,email:$('email').value,password:$('password').value})})}else{d=await SNP.request('/api/v1/auth/login',{method:'POST',body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});if(d.user.role!=='driver')throw new Error('This account belongs to '+d.user.role+' portal.')}SNP.saveSession(d);show(d.message||'Success. Opening dashboard...',true);setTimeout(()=>location.href='dashboard.html',500)}catch(e){show(e.message)}};render();</script></body></html>
