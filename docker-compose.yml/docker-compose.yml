services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: shipnovaportal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - portal_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shipnovaportal
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: change-this-to-a-random-32-character-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-this-password
    ports:
      - "4000:4000"
    command: sh -c "npm run migrate && node dist/server.js"
volumes:
  portal_pg:
